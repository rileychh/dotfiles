setupVersion: 2
modelRoles:
  default: openai-codex/gpt-6.1-sol:medium
  smol: openai-codex/gpt-6-luna:high
  slow: openai-codex/gpt-6-astra:medium
  task: openai-codex/gpt-6.1-sol
  tiny: chris/qwen3.8-flash-next-uncensored@iq4_xs
defaultThinkingLevel: auto
browser:
  headless: false
  relay: true
display:
  cacheMissMarker: true
  shimmer: disabled
symbolPreset: nerd
theme:
  dark: dark-monochrome
statusLine:
  separator: none
  sessionAccent: false
  transparent: true
tui:
  codexResetFireworks: true
steeringMode: all
providers:
  autoThinkingMaxEffort: max
hideThinkingBlock: true
dev:
  autoqaConsent: granted
composer:
  shape: rule
extendedContext: true
compaction:
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
  thresholdPercent: 95
task:
  isolation:
    enabled: true
worktree:
  base: /Volumes/Code/.omp/wt
todo:
  reminders: false
codexResets:
  autoRedeem: "no"
tier:
  openai: priority