  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
  thresholdPercent: 95
task:
  isolation:
    enabled: true
worktree:
  base: /Volumes/Code/.omp/wt
todo:
  reminders: false
