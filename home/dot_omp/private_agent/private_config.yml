setupVersion: 3
modelRoles:
  tiny: chris/qwen3.8-flash-next-uncensored@iq4_xs
  smol: openai-codex/gpt-6-luna:high
  default: openai-codex/gpt-6.1-sol:medium
  slow: openai-codex/gpt-6-astra:medium
  task: openai-codex/gpt-6.1-sol
defaultThinkingLevel: auto
browser:
  headless: false
  relay: true
display:
  cacheMissMarker: true
  shimmer: disabled
symbolPreset: nerd
theme:
  dark: dark-monochrome
statusLine:
  separator: none
  sessionAccent: false
  transparent: true
tui:
  codexResetFireworks: true
  vimMode: true
  vimModeDisplay: icon
steeringMode: all
providers:
  autoThinkingMaxEffort: max
hideThinkingBlock: true
dev:
  autoqaConsent: granted
composer:
  shape: rule
  tokenRate: true
extendedContext: true
