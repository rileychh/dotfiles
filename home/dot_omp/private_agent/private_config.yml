  autoRedeem5h: "no"
  autoRedeemWeekly: "no"
update:
  auto: true
modelPresets:
  openai-codex:
    modelRoles:
      default: openai-codex/gpt-6.1-sol:medium
      smol: openai-codex/gpt-6-luna:high
      slow: openai-codex/gpt-6-astra:medium
      task: openai-codex/gpt-6.1-sol
    defaultThinkingLevel: auto
  google-agent-platform:
    modelRoles:
      smol: google-vertex/gemini-4-hydrogen:medium
      default: google-vertex/gemini-4-argon:medium
      slow: google-vertex/gemini-4-carbon:high
    defaultThinkingLevel: auto
title:
  icons: boring